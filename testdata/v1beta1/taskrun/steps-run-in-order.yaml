apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  name: steps-run-in-order-vb
spec:
  taskSpec:
    steps:
    - image: registry.access.redhat.com/ubi9/ubi:latest
      # NB: command is not set, so it must be looked up from the registry.
      args: ['-c', 'sleep 300 && touch foo']
    - image: registry.access.redhat.com/ubi9/ubi:latest
      args: ['-c', 'ls', 'foo']
